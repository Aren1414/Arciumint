name: Arcium MPC Build

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  build-mpc:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - uses: actions/checkout@v4

      # -----------------------------
      # Install Solana
      # -----------------------------
      - name: Install Solana
        run: |
          set -e
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      # -----------------------------
      # Install Anchor (pinned)
      # -----------------------------
      - name: Install Anchor
        run: |
          set -e
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Install Arcium CLI (official)
      # -----------------------------
      - name: Install Arcium
        run: |
          set -e
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          arcium --version

      # -----------------------------
      # BUILD MPC
      # -----------------------------
      - name: Build MPC
        run: |
          set -e
          cd arcium/disc_mpc
          arcium build
