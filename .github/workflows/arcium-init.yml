name: Init Arcium MXE

on:
  workflow_dispatch:

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Install Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

          solana --version

      # -----------------------------
      # Install Anchor (AVM)
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail

          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install latest
          avm use latest

          anchor --version

      # -----------------------------
      # Install Arcium Tooling (official)
      # -----------------------------
      - name: Install Arcium tooling
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$PATH"

          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          arcium --version

      # -----------------------------
      # Initialize Arcium MPC Project
      # -----------------------------
      - name: Initialize Arcium DISC MPC Project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          mkdir -p arcium
          cd arcium

          arcium init disc-mpc

      # -----------------------------
      # FIX client version + install deps
      # -----------------------------
      - name: Fix Arcium client version and install deps
        shell: bash
        run: |
          set -euo pipefail

          cd arcium/disc-mpc

          # FIX WRONG TEMPLATE VERSION
          sed -i 's/"@arcium-hq\/client": *"[^"]*"/"@arcium-hq\/client": "^0.5.2"/' package.json

          yarn install

      # -----------------------------
      # Commit generated files
      # -----------------------------
      - name: Commit Arcium project
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add arcium
          git commit -m "init arcium DISC MPC project" || echo "Nothing to commit"
          git push
