name: Init Arcium MXE

on:
  workflow_dispatch:

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Install Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      # -----------------------------
      # Install Arcium Tooling (official)
      # -----------------------------
      - name: Install Arcium tooling
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          arcium --version
          anchor --version

      # -----------------------------
      # Initialize Arcium MPC Project (ALLOW FAILURE)
      # -----------------------------
      - name: Initialize Arcium DISC MPC Project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arcium
          cd arcium

          # IMPORTANT:
          # arcium init FAILS because of client version
          # but it DOES create the project files
          arcium init disc-mpc || true

      # -----------------------------
      # Fix client version + install deps manually
      # -----------------------------
      - name: Fix Arcium client version
        shell: bash
        run: |
          set -euo pipefail
          cd arcium/disc-mpc

          sed -i 's/"@arcium-hq\/client": *"[^"]*"/"@arcium-hq\/client": "^0.5.2"/' package.json

          yarn install

      # -----------------------------
      # Commit generated files
      # -----------------------------
      - name: Commit Arcium project
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add arcium
          git commit -m "init arcium DISC MPC project" || echo "Nothing to commit"
          git push
