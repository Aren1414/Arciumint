name: Init Arcium MXE

on:
  workflow_dispatch:

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Solana CLI (official, stable)
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -e
          curl -sSfL https://solana-install.solana.workers.dev | bash
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      # -----------------------------
      # Anchor (PINNED 0.32.1 — no "latest")
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -e
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Install arcup (OFFICIAL BINARY)
      # -----------------------------
      - name: Install arcup
        shell: bash
        run: |
          set -e
          curl -sSfL https://bin.arcium.com/download/arcup_x86_64_linux_0.6.0-alpha \
            -o arcup
          chmod +x arcup
          sudo mv arcup /usr/local/bin/arcup
          arcup --version

      # -----------------------------
      # Install Arcium CLI ONLY (no node, no surfpool)
      # -----------------------------
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -e
          arcup install 0.6.0-alpha
          arcium --version

      # -----------------------------
      # Init MPC project (this creates files)
      # -----------------------------
      - name: Initialize MPC project
        shell: bash
        run: |
          set -e
          mkdir -p arcium
          cd arcium
          arcium init disc-mpc

      # -----------------------------
      # Fix client version to PUBLISHED SDK
      # -----------------------------
      - name: Fix Arcium client dependency
        shell: bash
        run: |
          set -e
          cd arcium/disc-mpc
          sed -i 's/"@arcium-hq\/client": *"[^"]*"/"@arcium-hq\/client": "^0.5.2"/' package.json
          yarn install

      # -----------------------------
      # Commit generated files
      # -----------------------------
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add arcium
          git commit -m "init arcium MPC project" || true
          git push
