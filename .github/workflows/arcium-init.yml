name: Init Arcium MXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Solana
      # -----------------------------
      - name: Install Solana
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      # -----------------------------
      # Anchor (pinned)
      # -----------------------------
      - name: Install Anchor
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Arcium CLI (official)
      # -----------------------------
      - name: Install Arcium
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          arcium --version

      # -----------------------------
      # Init project (ALLOW FAILURE)
      # -----------------------------
      - name: Init MPC project
        run: |
          set -euo pipefail
          mkdir -p arcium
          cd arcium

          # This WILL fail because of yarn – expected
          arcium init disc-mpc || true

      # -----------------------------
      # Fix JS client version SAFELY
      # -----------------------------
      - name: Fix client version
        run: |
          set -euo pipefail
          cd arcium/disc_mpc

          sudo apt-get update
          sudo apt-get install -y jq

          jq '.dependencies["@arcium-hq/client"]="^0.5.2"' package.json > package.tmp.json
          mv package.tmp.json package.json

          yarn install

      # -----------------------------
      # Remove nested git repo
      # -----------------------------
      - name: Remove nested git
        run: |
          rm -rf arcium/disc_mpc/.git

      # -----------------------------
      # Commit
      # -----------------------------
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add arcium
          git commit -m "init arcium MPC project" || true
          git push
