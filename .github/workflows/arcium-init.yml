name: Init Arcium MXE

on:
  workflow_dispatch:

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - uses: actions/checkout@v4

      # -----------------------------
      # Solana CLI (manual, stable)
      # -----------------------------
      - name: Install Solana
        run: |
          set -e
          curl -sSfL https://solana-install.solana.workers.dev | bash
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      # -----------------------------
      # Anchor (PINNED)
      # -----------------------------
      - name: Install Anchor
        run: |
          set -e
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Install arcup ONLY (no installer)
      # -----------------------------
      - name: Install arcup
        run: |
          set -e
          curl -L https://bin.arcium.com/download/arcup_x86_64_linux_0.6.0-alpha \
            -o arcup
          chmod +x arcup
          mv arcup /usr/local/bin/arcup
          arcup --version

      # -----------------------------
      # Install arcium CLI ONLY
      # -----------------------------
      - name: Install arcium CLI
        run: |
          set -e
          arcup install --cli-only
          arcium --version

      # -----------------------------
      # Init MPC project
      # -----------------------------
      - name: Init MPC
        run: |
          set -e
          mkdir -p arcium
          cd arcium
          arcium init disc-mpc

      # -----------------------------
      # Fix client version (documented)
      # -----------------------------
      - name: Fix client
        run: |
          cd arcium/disc-mpc
          sed -i 's/"@arcium-hq\/client": *"[^"]*"/"@arcium-hq\/client": "^0.5.2"/' package.json
          yarn install

      # -----------------------------
      # Commit
      # -----------------------------
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add arcium
          git commit -m "init arcium MPC project" || true
          git push
