name: Init Arcium MXE

on:
  workflow_dispatch:

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install Arcium CLI
        run: |
          cargo install --git https://github.com/arciumxyz/arcium-cli

      - name: Init Arcium MXE
        run: |
          arcium init arciumint-mxe

      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add arciumint-mxe
          git commit -m "init arcium mxe"
          git push
