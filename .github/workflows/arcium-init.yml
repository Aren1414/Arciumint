name: Init Arcium MXE

on:
  workflow_dispatch:

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Install Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      # -----------------------------
      # Install Anchor (FIXED VERSION – no "latest")
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Install Arcium CLI (SKIP SURFPOOL)
      # -----------------------------
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          # Prevent surfpool check
          export ARCIUM_SKIP_SURFPOOL=1

          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          arcium --version

      # -----------------------------
      # Init MPC project (ALLOW CLIENT FAIL)
      # -----------------------------
      - name: Init Arcium MPC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arcium
          cd arcium

          # client version bug – ignore failure
          arcium init disc-mpc || true

      # -----------------------------
      # Fix client version manually
      # -----------------------------
      - name: Fix Arcium client version
        shell: bash
        run: |
          set -euo pipefail
          cd arcium/disc-mpc

          sed -i 's/"@arcium-hq\/client": *"[^"]*"/"@arcium-hq\/client": "^0.5.2"/' package.json
          yarn install

      # -----------------------------
      # Commit generated files
      # -----------------------------
      - name: Commit Arcium project
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add arcium
          git commit -m "init arcium DISC MPC project" || echo "Nothing to commit"
          git push
