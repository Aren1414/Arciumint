name: Init Arcium MXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Install Solana CLI
      # -----------------------------
      - name: Install Solana
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      # -----------------------------
      # Install Anchor (PINNED)
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Install Arcium tooling (official)
      # -----------------------------
      - name: Install Arcium
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          arcium --version

      # -----------------------------
      # Init MPC project
      # -----------------------------
      - name: Init MPC project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arcium
          cd arcium

          arcium init disc-mpc || true

          cd disc_mpc

          # Fix published client version (documented & real)
          sed -i 's/"@arcium-hq\/client":[^"]*"/"@arcium-hq\/client": "^0.5.2"/' package.json
          yarn install

          cd ../..

          # 🔥 CRITICAL FIX
          # Remove nested git repo created by arcium init
          rm -rf arcium/disc_mpc/.git

      # -----------------------------
      # Commit
      # -----------------------------
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add arcium
          git commit -m "init arcium MPC project" || true
          git push
