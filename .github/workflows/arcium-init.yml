name: Init Arcium MXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # (Optional but recommended) make sure Rust is present (GitHub runner usually has it)
      - name: Show Rust
        shell: bash
        run: |
          set -euo pipefail
          rustc -V
          cargo -V

      # Install Solana + Anchor (you were already doing this successfully)
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      - name: Install Anchor (AVM) pinned
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          # pin to avoid "latest" GitHub API timeouts
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # Install Arcium tooling via official installer (installs arcup + arcium)
      - name: Install Arcium tooling
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          arcium --version

      # Initialize project, then fix npm package version if template points to a non-published version
      - name: Init MPC project (and fix client version if needed)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          mkdir -p arcium
          cd arcium

          # arcium init creates: disc_mpc  (underscore) as your log shows
          set +e
          arcium init disc-mpc
          INIT_EXIT=$?
          set -e

          # If init failed because yarn couldn't find @arcium-hq/client version,
          # patch to a published version and install deps.
          if [ -d "disc_mpc" ]; then
            cd disc_mpc

            if [ $INIT_EXIT -ne 0 ]; then
              echo "Init step failed (likely yarn). Patching @arcium-hq/client to ^0.5.2 and retrying yarn..."
              if [ -f package.json ]; then
                # replace any @arcium-hq/client version with ^0.5.2
                sed -i 's/"@arcium-hq\/client":[[:space:]]*"[^"]*"/"@arcium-hq\/client": "^0.5.2"/' package.json
              fi
              yarn install
            fi

            cd ..
          else
            echo "Expected folder arcium/disc_mpc was not created."
            exit 1
          fi

          cd ..

      - name: Commit and push generated project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add arcium
          git commit -m "init arcium MPC project" || echo "Nothing to commit"
          git push
