name: Init Arcium MXE

on:
  workflow_dispatch:

jobs:
  init-arcium:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Solana + Anchor + Surfpool (official script)
        shell: bash
        run: |
          set -euo pipefail

          # Make sure user-local bins come first (prevents picking an old surfpool from system PATH)
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

          # If a preinstalled surfpool exists in a system path, remove it to avoid version shadowing
          if command -v surfpool >/dev/null 2>&1; then
            sudo rm -f "$(command -v surfpool)" || true
          fi

          # Arcium docs suggest using this installer for prerequisites
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash

          # Activate Solana path immediately in THIS step (GITHUB_PATH applies next steps only)
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

          # Persist for next steps
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          solana --version
          anchor --version
          surfpool --version

      - name: Install Arcium tooling (arcup)
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

          # Official Arcium tooling installer
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash

          # Ensure arcup/arcium in PATH for next lines
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"

          arcup install
          arcium --version
