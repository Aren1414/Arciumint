name: Arcium MPC CI

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  arcium-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # System deps
      - name: System dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq

      # Rust toolchains
      # stable = host tools default
      # nightly = Cargo that understands edition2024
      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.83.0 --profile minimal
          rustup toolchain install nightly --profile minimal
          rustup default 1.83.0
          rustc --version
          cargo +nightly --version

      # Solana CLI (pinned)
      - name: Install Solana CLI
        shell: bash
        env:
          SOLANA_VERSION: "1.18.26"
        run: |
          set -euo pipefail
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version

      # Node / Yarn
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      # Anchor (AVM pinned)
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # Arcium CLI (binary)
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o arcium
          chmod +x arcium
          sudo mv arcium /usr/local/bin/arcium
          arcium --version

      # BUILD MPC  <<< کلید حل مشکل >>>
      - name: Build Arcium MPC (Cargo nightly)
        shell: bash
        run: |
          set -euo pipefail
          cd arcium/disc_mpc
          yarn install
          CARGO="cargo +nightly" arcium build --skip-keys-sync
