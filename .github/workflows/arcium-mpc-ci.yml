name: Arcium MPC CI

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  arcium-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Solana
      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      # Anchor (pinned per docs)
      - name: Install Anchor
        run: |
          set -e
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # Arcium CLI
      - name: Install Arcium CLI
        run: |
          set -e
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          arcium --version

      # Build only (NO init, NO localnet)
      - name: Build Arcium MPC
        run: |
          set -e
          cd arcium/disc_mpc
          arcium build
