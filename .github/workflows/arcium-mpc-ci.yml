name: Arcium MPC CI

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  arcium-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq

      # Rust toolchain for host tooling (avm/anchor/arcium wrapper)
      # Note: This is NOT the Solana SBF toolchain; it's for host-side commands.
      - name: Install Rust 1.83.0 (host toolchain)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0
          rustc --version
          cargo --version

      - name: Install Solana CLI (pinned)
        shell: bash
        env:
          SOLANA_VERSION: "1.18.26"
        run: |
          set -euo pipefail
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      - name: Install Anchor (AVM pinned 0.32.1)
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      - name: Install Arcium CLI (binary)
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o arcium-cli
          chmod +x arcium-cli
          sudo mv arcium-cli /usr/local/bin/arcium
          arcium --version

      - name: Build Arcium MPC
        shell: bash
        run: |
          set -euo pipefail
          cd arcium/disc_mpc
          yarn install
          arcium build --skip-keys-sync
