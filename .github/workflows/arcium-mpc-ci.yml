name: Arcium MPC CI

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  arcium-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # System dependencies
      # -----------------------------
      - name: System deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # -----------------------------
      # Rust 1.83 (Anchor / Solana safe)
      # -----------------------------
      - name: Rust 1.83.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0
          rustc --version
          cargo --version

      # -----------------------------
      # Solana CLI (explicit, pinned)
      # -----------------------------
      - name: Install Solana CLI
        run: |
          set -euo pipefail
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      # -----------------------------
      # Anchor (AVM pinned)
      # -----------------------------
      - name: Anchor 0.32.1
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Arcium CLI ONLY (NO surfpool)
      # -----------------------------
      - name: Install Arcium CLI
        run: |
          set -euo pipefail
          curl -L https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o arcium
          chmod +x arcium
          sudo mv arcium /usr/local/bin/arcium
          arcium --version

      # -----------------------------
      # Build MPC
      # -----------------------------
      - name: Build Arcium MPC
        run: |
          set -euo pipefail
          cd arcium/disc_mpc
          arcium build --skip-keys-sync
