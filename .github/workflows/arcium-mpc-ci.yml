name: Arcium MPC CI

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  arcium-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # Install system deps
      # -----------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # -----------------------------
      # Install Rust toolchains
      # stable = compiler
      # nightly = Cargo (edition2024 support)
      # -----------------------------
      - name: Install Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable
          rustup toolchain install nightly
          rustup default stable
          rustc --version
          cargo +nightly --version

      # -----------------------------
      # Install Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version

      # -----------------------------
      # Install Anchor (AVM pinned)
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Install Arcium CLI (binary)
      # -----------------------------
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -L https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha \
            -o arcium-cli
          chmod +x arcium-cli
          sudo mv arcium-cli /usr/local/bin/arcium
          arcium --version

      # -----------------------------
      # Build MPC (Cargo = nightly)
      # -----------------------------
      - name: Build Arcium MPC
        shell: bash
        run: |
          set -euo pipefail
          cd arcium/disc_mpc
          CARGO="cargo +nightly" arcium build --skip-keys-sync
