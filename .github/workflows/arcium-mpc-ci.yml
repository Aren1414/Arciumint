name: Arcium MPC CI

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  arcium-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # System dependencies
      # -----------------------------
      - name: System dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq

      # -----------------------------
      # Rust toolchain (STABLE ONLY)
      # -----------------------------
      - name: Install Rust 1.83.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0
          rustc --version
          cargo --version

      # -----------------------------
      # Solana CLI (pinned)
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        env:
          SOLANA_VERSION: "1.18.26"
        run: |
          set -euo pipefail
          curl -fL "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o /tmp/solana.tar.bz2
          tar -xjf /tmp/solana.tar.bz2 -C /tmp
          sudo mv /tmp/solana-release/bin/* /usr/local/bin/
          solana --version

      # -----------------------------
      # Node / Yarn
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      # -----------------------------
      # Anchor (AVM pinned)
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Arcium CLI
      # -----------------------------
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha \
            -o /tmp/arcium
          chmod +x /tmp/arcium
          sudo mv /tmp/arcium /usr/local/bin/arcium
          arcium --version

      # -----------------------------
      # FIX TRANSITIVE DEPS (CRITICAL STEP)
      # -----------------------------
      - name: Force RustCrypto deps to pre-edition2024
        shell: bash
        run: |
          set -euo pipefail
          cd arcium/disc_mpc
          cargo update -p const-oid --precise 0.9.6
          cargo update -p base64ct --precise 1.6.0
          cargo update -p pkcs8 --precise 0.10.2
          cargo update -p sec1 --precise 0.7.3
          cargo update -p spki --precise 0.7.3
          cargo update -p digest --precise 0.10.7
          cargo update -p crypto-common --precise 0.1.7

      # -----------------------------
      # BUILD MPC
      # -----------------------------
      - name: Build Arcium MPC
        shell: bash
        run: |
          set -euo pipefail
          cd arcium/disc_mpc
          yarn install
          arcium build --skip-keys-sync
