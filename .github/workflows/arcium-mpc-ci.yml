name: Arcium MPC CI

on:
  workflow_dispatch:
  push:
    paths:
      - "arcium/**"

jobs:
  arcium-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # Solana CLI (NO installer side-effects)
      # -----------------------------
      - name: Install Solana CLI
        run: |
          set -e
          curl -sSfL https://solana-install.solana.workers.dev | bash
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      # -----------------------------
      # Anchor (PINNED – per docs)
      # -----------------------------
      - name: Install Anchor
        run: |
          set -e
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Install Arcium CLI ONLY (no installer)
      # -----------------------------
      - name: Install Arcium CLI
        run: |
          set -e
          curl -L https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha \
            -o arcium
          chmod +x arcium
          sudo mv arcium /usr/local/bin/arcium
          arcium --version

      # -----------------------------
      # Build MPC (ONLY)
      # -----------------------------
      - name: Build Arcium MPC
        run: |
          set -e
          cd arcium/disc_mpc
          arcium build
