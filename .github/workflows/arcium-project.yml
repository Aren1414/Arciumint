name: Init Arcium Project

on:
  workflow_dispatch:

jobs:
  init-project:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------------
      # Install Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # -----------------------------
      # Install Anchor (AVM)
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install latest
          avm use latest

      # -----------------------------
      # Install Arcium Tooling (Official Installer)
      # -----------------------------
      - name: Install Arcium
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$PATH"

          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"

          arcium --version

      # -----------------------------
      # Initialize Arcium MPC Project (MPC ONLY – no Node client)
      # -----------------------------
      - name: Initialize Arcium DISC MPC Project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p arcium
          cd arcium

          # IMPORTANT:
          # --no-client is REQUIRED because @arcium-hq/client@0.6.0-alpha
          # is NOT published on npm yet.
          arcium init disc-mpc --no-client

      # -----------------------------
      # Commit generated files
      # -----------------------------
      - name: Commit Arcium project
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add arcium
          git commit -m "init arcium DISC MPC project" || echo "Nothing to commit"
          git push
