name: Init Arcium Project

on:
  workflow_dispatch:

jobs:
  init-project:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          arcium --version

      - name: Init Arcium MPC Project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arcium
          cd arcium
          arcium init disc-mpc
