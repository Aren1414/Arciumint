name: Arcium Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # =========================
      # Wallet
      # =========================
      - name: Restore Solana wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      # =========================
      # Rust (FIXED)
      # =========================
      - name: Install Rust nightly (clean + stable override)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y

          source $HOME/.cargo/env

          rustup toolchain install nightly
          rustup default nightly

          # IMPORTANT: ensure CI actually uses nightly everywhere
          rustup override set nightly

          rustc --version
          cargo --version

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/env" >> $GITHUB_ENV

      # =========================
      # Solana
      # =========================
      - name: Install Solana
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash

          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # =========================
      # Arcium
      # =========================
      - name: Install Arcium 0.10.1
        run: |
          curl -L https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # =========================
      # Verify
      # =========================
      - name: Verify toolchain
        run: |
          which cargo
          cargo --version
          rustc --version
          solana --version
          arcium --version

      # =========================
      # CLEAN (FIXED + IMPORTANT)
      # =========================
      - name: Clean workspace (Arcium-safe)
        run: |
          cd arcium/disc_mpc

          rm -rf build
          rm -rf target
          rm -rf Cargo.lock || true

          cargo clean || true

      # =========================
      # BUILD (CRITICAL ORDER FIX)
      # =========================
      - name: Build Arcium project
        run: |
          cd arcium/disc_mpc

          # ⚠️ IMPORTANT: DO NOT run cargo build first
          # Arcium must generate artifacts FIRST
          arcium build --skip-keys-sync

      # =========================
      # VERIFY ARTIFACTS (NEW)
      # =========================
      - name: Verify build artifacts
        run: |
          ls -la arcium/disc_mpc/build || exit 1

      # =========================
      # DEPLOY
      # =========================
      - name: Deploy project
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com

      # =========================
      # COMMIT OUTPUT
      # =========================
      - name: Commit build output
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add arcium/disc_mpc/build

          git commit -m "Update Arcium build output" || echo "No changes"
          git push origin HEAD:main
