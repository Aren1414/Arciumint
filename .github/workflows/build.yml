name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libc6-dev \
            libc6-dev-i386 \
            linux-libc-dev \
            clang \
            llvm \
            gcc \
            curl \
            git

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana

          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json

          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y

          source "$HOME/.cargo/env"

          rustup default stable

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"

          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

          solana --version

      - name: Install Anchor
        run: |
          cargo install --locked anchor-cli --version 1.0.2

          anchor --version

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

          arcup self update || true
          arcup update || true

          arcium --version

      - name: FULL RESET + Generate Program Keypair
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

          cd arcium/disc_mpc

          echo "Cleaning old artifacts..."

          rm -rf target
          rm -rf .anchor
          rm -rf build
          rm -f target/deploy/disc_mpc-keypair.json
          rm -f program-keypair.json

          mkdir -p target/deploy

          echo "Generating fresh program keypair..."

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          cp target/deploy/disc_mpc-keypair.json program-keypair.json

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)

          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

          echo "Generated Program ID:"
          echo "$PROGRAM_ID"

      - name: Sync Program IDs
        run: |
          cd arcium/disc_mpc

          anchor keys sync

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)

          echo "Setting localnet program id..."

          sed -i "s|disc_mpc = \".*\"|disc_mpc = \"$PROGRAM_ID\"|g" Anchor.toml

          echo "------ VERIFYING IDS ------"

          echo "Anchor.toml program ids:"
          grep disc_mpc Anchor.toml || true

          echo ""
          echo "Rust declare_id:"
          grep -R "declare_id!" programs || true

          echo ""
          echo "Keypair Address:"
          solana address -k target/deploy/disc_mpc-keypair.json

      - name: Configure Cargo for SBPF
        run: |
          mkdir -p ~/.cargo

          cat > ~/.cargo/config.toml << 'EOF'
          [target.sbfv2-solana-solana]
          rustflags = ["--cfg", "getrandom_backend=\"custom\""]

          [target.sbf-solana-solana]
          rustflags = ["--cfg", "getrandom_backend=\"custom\""]
          EOF

      - name: Generate Cargo.lock
        run: |
          cd arcium/disc_mpc

          cargo generate-lockfile

      - name: Clean Cargo Cache
        run: |
          cd arcium/disc_mpc

          cargo clean

      - name: Build Program
        run: |
          cd arcium/disc_mpc

          mkdir -p target/deploy

          cp program-keypair.json target/deploy/disc_mpc-keypair.json

          echo "Build keypair:"
          solana address -k target/deploy/disc_mpc-keypair.json

          arcium build --skip-keys-sync

      - name: Verify Final Program ID
        run: |
          cd arcium/disc_mpc

          echo "Final source declare_id:"
          grep -R "declare_id!" programs || true

          echo ""

          echo "Final Anchor.toml:"
          grep disc_mpc Anchor.toml || true

          echo ""

          echo "Final build keypair:"
          solana address -k target/deploy/disc_mpc-keypair.json

      - name: Deploy Program
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build

      - name: Commit Artifacts
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git config --global user.name "github-actions[bot]"

          git add \
            arcium/disc_mpc/build \
            arcium/disc_mpc/Anchor.toml \
            arcium/disc_mpc/program-keypair.json \
            arcium/disc_mpc/Cargo.lock \
            arcium/disc_mpc/target/deploy \
            2>/dev/null || true

          git commit -m "fresh deploy ${PROGRAM_ID:-unknown}" \
            2>/dev/null || echo "No changes to commit"

          git push 2>/dev/null || echo "Push failed"
