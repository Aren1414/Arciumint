name: Arcium Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana (APT method — official & stable)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg curl
          curl -sSfL https://release.solana.com/stable/solana-release.gpg | gpg --dearmor | sudo tee /usr/share/keyrings/solana.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/solana.gpg] https://release.solana.com/stable/apt stable main" | sudo tee /etc/apt/sources.list.d/solana.list
          sudo apt-get update
          sudo apt-get install -y solana-cli
          solana --version

      - name: Install AVM (Anchor Version Manager)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install latest
          avm use latest
          anchor --version

      - name: Build Arcium
        run: |
          arcium build --skip-keys-sync

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcium-build
          path: build
