name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libc6-dev clang llvm gcc curl git

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana (stable)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      - name: Install Anchor 1.0.2
        run: |
          cargo install --locked anchor-cli --version 1.0.2
          anchor --version

      - name: Install Arcium CLI (v0.10.3)
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          arcup self update || true
          arcup update || true
          arcium --version

      - name: Generate Program Keypair
        run: |
          cd arcium/disc_mpc
          mkdir -p target/deploy
          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force
          cp target/deploy/disc_mpc-keypair.json program-keypair.json
          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

      - name: Sync Anchor Program IDs
        run: |
          cd arcium/disc_mpc
          anchor keys sync

      - name: Force Cargo Clean
        run: |
          cd arcium/disc_mpc
          cargo clean

      - name: Build Program (Arcium)
        run: |
          cd arcium/disc_mpc
          arcium build

      - name: Deploy Program
        run: |
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build

      - name: Commit artifacts
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add arcium/disc_mpc || true
          git commit -m "fresh deploy $PROGRAM_ID" || true
          git push || true 
