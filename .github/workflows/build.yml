name: Arcium Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Solana 2.3.0 (Arcium compatible)
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      - name: Install Rust + Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Arcium toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          arcium --version

      - name: Build Arcium (correct workspace)
        run: |
          cd arcium/disc_mpc
          solana --version
          anchor --version
          arcium --version
          arcium build --skip-keys-sync

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcium-build
          path: arcium/disc_mpc/build
