name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libc6-dev \
            libc6-dev-i386 \
            linux-libc-dev \
            clang \
            llvm \
            gcc \
            curl \
            git

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"

          solana --version

      - name: Install Anchor
        run: |
          cargo install --locked anchor-cli --version 1.0.2
          anchor --version

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

          arcup self update || true
          arcup update || true

          arcium --version

      - name: Generate SINGLE Program Keypair
        run: |
          cd arcium/disc_mpc

          mkdir -p target/deploy

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          cp target/deploy/disc_mpc-keypair.json program-keypair.json

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)

          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

          echo "Using Program ID: $PROGRAM_ID"

      - name: Sync Program IDs Everywhere
        run: |
          cd arcium/disc_mpc

          anchor keys sync

          echo "------ CHECKING IDS ------"

          grep declare_id programs/src/lib.rs || true

          cat Anchor.toml || true

          echo "Generated key:"
          solana address -k target/deploy/disc_mpc-keypair.json

      - name: Clean Cargo
        run: |
          cd arcium/disc_mpc
          cargo clean

      - name: Build Program
        run: |
          cd arcium/disc_mpc

          arcium build --skip-keys-sync

      - name: Deploy Program
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build

      - name: Commit Artifacts
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add arcium/disc_mpc || true

          git commit -m "fresh deploy $PROGRAM_ID" || true

          git push || true
