name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTUP_TOOLCHAIN: nightly
      CARGO_UNSTABLE_EDITION2024: "1"
      ARCIUM_DOCKER: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana + Anchor
        run: |
          curl -sSfL https://solana-install.solana.workers.dev | bash
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Arcium
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify versions
        run: |
          source $HOME/.cargo/env
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          rustc --version
          cargo --version
          solana --version
          anchor --version
          arcium --version

      - name: Clean caches
        run: |
          rm -rf ~/.arcium
          rm -rf arcium/disc_mpc/.anchor
          rm -f arcium/disc_mpc/Cargo.lock
          rm -rf arcium/disc_mpc/target

      - name: Normalize anchor-lang version in CI
        run: |
          cd arcium/disc_mpc
          cargo update -p anchor-lang --precise 0.32.1 || true

      - name: Generate Program ID
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile program-keypair.json
          PROGRAM_ID=$(solana address -k program-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          echo "Generated Program ID:"
          echo "$PROGRAM_ID"

      - name: Update Anchor.toml
        run: |
          sed -i "s/^disc_mpc = \".*\"/disc_mpc = \"$PROGRAM_ID\"/g" arcium/disc_mpc/Anchor.toml

      - name: Update declare_id
        run: |
          sed -i "s/declare_id!(\".*\")/declare_id!(\"$PROGRAM_ID\")/g" arcium/disc_mpc/programs/src/lib.rs

      - name: Build (Docker mode)
        run: |
          source $HOME/.cargo/env
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      - name: Verify artifacts
        run: |
          test -f arcium/disc_mpc/build/compute_disc.arcis
          test -f arcium/disc_mpc/build/compute_disc.hash

      - name: Deploy
        run: |
          source $HOME/.cargo/env
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair ../../program-keypair.json

      - name: Test deployed program
        run: |
          source $HOME/.cargo/env
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          arcium test --cluster devnet

      - name: Commit generated files
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "fresh deploy $PROGRAM_ID" || echo "No changes"
          git push
