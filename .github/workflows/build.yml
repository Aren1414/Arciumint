name: Arcium Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust nightly
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup toolchain install nightly
          rustup default nightly
          rustup override set nightly || true
          rustc --version
          cargo --version
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Arcium
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify toolchain consistency
        run: |
          which cargo
          cargo --version
          rustc --version
          solana --version
          arcium --version

      - name: Clean workspace
        run: |
          cd arcium/disc_mpc
          rm -rf build
          rm -rf target
          cargo clean || true

      - name: Arcium build
        run: |
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      - name: Validate build output
        run: |
          test -f arcium/disc_mpc/build/compute_disc.arcis
          test -f arcium/disc_mpc/build/compute_disc.hash

      - name: Deploy
        run: |
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com

      - name: Test deployed program
        run: |
          cd arcium/disc_mpc
          arcium test --cluster devnet

      - name: Commit build output
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add arcium/disc_mpc/build
          git commit -m "Update Arcium build output" || echo "No changes"
          git push origin HEAD:main
