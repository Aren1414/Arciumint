name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --user root

    steps:
      - name: Install basic system tools
        run: |
          apt-get update
          apt-get install -y \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libc6-dev \
            clang \
            llvm \
            ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
          echo 'source $HOME/.cargo/env' >> $HOME/.bashrc
          . "$HOME/.cargo/env"

      - name: Install Solana 3.1.10
        run: |
          . "$HOME/.cargo/env"
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo 'export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"' >> $HOME/.bashrc

      - name: Install Anchor 1.0.2
        run: |
          . "$HOME/.cargo/env"
          cargo install --locked anchor-cli --version 1.0.2

      - name: Install Arcium CLI
        run: |
          . "$HOME/.cargo/env"
          curl -sSfL https://install.arcium.com/ | bash

      - name: Verify Installed Versions
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "=== Rust Version ==="
          rustc --version
          cargo --version
          echo "=== Solana Version ==="
          solana --version
          echo "=== Anchor Version ==="
          anchor --version
          echo "=== Arcium Version ==="
          arcium --version

      - name: Generate Program Keypair
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          mkdir -p target/deploy

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          cp target/deploy/disc_mpc-keypair.json program-keypair.json

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          echo "=== Generated Program ID ==="
          echo "$PROGRAM_ID"

      - name: Sync Anchor Program IDs
        run: |
          . "$HOME/.cargo/env"
          cd arcium/disc_mpc
          anchor keys sync

      - name: Build Arcium Program
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          echo "=== Starting Arcium Build ==="
          arcium build
          echo "=== Build Completed Successfully ==="

      - name: Deploy to Devnet
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          echo "=== Starting Deployment ==="
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build
          echo "=== Deployment Completed ==="

      - name: Display Deployment Info
        if: success()
        run: |
          echo "=== Deployment Summary ==="
          echo "Program ID: $PROGRAM_ID"
          echo "Cluster: Devnet"
          echo "Cluster Offset: 456"
          echo "Recovery Set Size: 4"

      - name: Commit Build Artifacts
        if: always()
        run: |
          # Configure git for container
          git config --global --add safe.directory /__w/Arciumint/Arciumint
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Add and commit changes
          cd arcium/disc_mpc
          git add . || true
          git commit -m "Deploy: Program ID $PROGRAM_ID [skip ci]" || true
          git push || true

      - name: Cleanup on Failure
        if: failure()
        run: |
          echo "=== Build/Deploy Failed ==="
          echo "Check the logs above for error details"
          echo "Common issues:"
          echo "1. RPC connection problems - try a different RPC endpoint"
          echo "2. Insufficient SOL in wallet"
          echo "3. Network congestion"
