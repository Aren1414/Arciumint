name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      
      - name: Setup Arcium
        uses: arcium-hq/setup-arcium@v0.9.3
        with:
          runner-arch-os: x86_64_linux
          arcium-version: "0.10.1"      
          anchor-version: "1.0.1"       
          solana-cli-version: "3.1.15"  

      - name: Verify versions
        run: |
          rustc --version
          cargo --version
          solana --version
          arcium --version

      - name: Generate Program ID
        run: |
          solana-keygen new --silent --no-bip39-passphrase --outfile program-keypair.json --force
          PROGRAM_ID=$(solana address -k program-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          sed -i "s/^disc_mpc = \".*\"/disc_mpc = \"$PROGRAM_ID\"/g" arcium/disc_mpc/Anchor.toml
          find arcium/disc_mpc/programs -name "*.rs" -type f -exec sed -i "s/declare_id!(\".*\")/declare_id!(\"$PROGRAM_ID\")/g" {} \;

      - name: Build
        run: |
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      - name: Deploy
        run: |
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair ../../program-keypair.json \
            --skip-build

      - name: Test deployed program
        run: |
          cd arcium/disc_mpc
          sudo prlimit --pid $$ --nofile=1048576:1048576
          arcium test --cluster devnet

      - name: Commit generated files
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add arcium/disc_mpc/build arcium/disc_mpc/Anchor.toml program-keypair.json 2>/dev/null || true
          git commit -m "fresh deploy $PROGRAM_ID" 2>/dev/null || echo "No changes to commit"
          git push 2>/dev/null || echo "Push failed"
