name: Arcium Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana (mirror, no SSL issues)
        run: |
          wget https://solana-mirror.s3.amazonaws.com/solana-install-init-x86_64-unknown-linux-gnu
          chmod +x solana-install-init-x86_64-unknown-linux-gnu
          ./solana-install-init-x86_64-unknown-linux-gnu --no-modify-path
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      - name: Install AVM (Anchor Version Manager)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install latest
          avm use latest
          anchor --version

      - name: Build Arcium
        run: |
          arcium build --skip-keys-sync

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcium-build
          path: build
