name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust and Solana
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Backup current code
        run: |
          mkdir -p /tmp/backup/encrypted-ixs
          mkdir -p /tmp/backup/programs
          cp -r arcium/disc_mpc/encrypted-ixs/* /tmp/backup/encrypted-ixs/ 2>/dev/null || true
          cp -r arcium/disc_mpc/programs/* /tmp/backup/programs/ 2>/dev/null || true
          echo "Backup completed"

      - name: Create fresh Arcium project
        run: |
          rm -rf arcium/disc_mpc
          mkdir -p arcium/disc_mpc
          cd arcium/disc_mpc
          arcium init fresh_project
          
          mv fresh_project/* ./
          mv fresh_project/.* ./. 2>/dev/null || true
          rm -rf fresh_project

      - name: Restore custom code
        run: |
          
          cp -r /tmp/backup/encrypted-ixs/* arcium/disc_mpc/encrypted-ixs/ 2>/dev/null || true
          cp -r /tmp/backup/programs/* arcium/disc_mpc/programs/ 2>/dev/null || true
          echo "Custom code restored"

      - name: Generate Program ID
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          solana-keygen new --silent --no-bip39-passphrase --outfile program-keypair.json --force
          PROGRAM_ID=$(solana address -k program-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          sed -i "s/^disc_mpc = \".*\"/disc_mpc = \"$PROGRAM_ID\"/g" Anchor.toml
          find programs -name "*.rs" -type f -exec sed -i "s/declare_id!(\".*\")/declare_id!(\"$PROGRAM_ID\")/g" {} \;

      - name: Build
        run: |
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      - name: Deploy
        run: |
          cd arcium/disc_mpc
          arcium deploy --cluster-offset 456 --recovery-set-size 4 --keypair-path ~/.config/solana/id.json --rpc-url https://api.devnet.solana.com --program-keypair ../../program-keypair.json --skip-build

      - name: Test
        run: |
          cd arcium/disc_mpc
          arcium test --cluster devnet

      - name: Commit generated files
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add arcium/disc_mpc/ program-keypair.json 2>/dev/null || true
          git commit -m "fresh deploy $PROGRAM_ID" 2>/dev/null || echo "No changes to commit"
          git push 2>/dev/null || echo "Push failed"
