name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Solana
        run: |
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Rust + Anchor deps
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup toolchain install nightly
          rustup default nightly
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Arcium
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # =========================
      # NEW PROGRAM ID GENERATION
      # =========================
      - name: Generate new Program ID
        run: |
          solana-keygen new --silent --no-bip39-passphrase --outfile program-keypair.json
          PROGRAM_ID=$(solana address -k program-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

      # =========================
      # UPDATE ANCHOR TOML
      # =========================
      - name: Inject Program ID into Anchor.toml
        run: |
          sed -i "s/^disc_mpc = .*/disc_mpc = \"$PROGRAM_ID\"/" arcium/disc_mpc/Anchor.toml

      # =========================
      # UPDATE RUST DECLARE ID
      # =========================
      - name: Inject Program ID into Rust
        run: |
          sed -i "s/declare_id!(\".*\")/declare_id!(\"$PROGRAM_ID\")/g" arcium/disc_mpc/programs/src/lib.rs

      # =========================
      # BUILD
      # =========================
      - name: Build
        run: |
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      # =========================
      # DEPLOY
      # =========================
      - name: Deploy
        run: |
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com

      # =========================
      # SAVE OUTPUT
      # =========================
      - name: Commit artifacts
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "github-actions"
          git add .
          git commit -m "fresh program deploy $PROGRAM_ID" || echo "no changes"
          git push
