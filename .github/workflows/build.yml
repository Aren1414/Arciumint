name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --user root

    steps:
      - name: Install basic system tools
        run: |
          apt-get update
          apt-get install -y \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libc6-dev \
            clang \
            llvm \
            ca-certificates

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /__w/Arciumint/Arciumint
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env"

      - name: Install Solana 3.1.10
        run: |
          . "$HOME/.cargo/env"
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"

      - name: Install Anchor 1.0.2
        run: |
          . "$HOME/.cargo/env"
          cargo install --locked anchor-cli --version 1.0.2

      - name: Install Arcium CLI
        run: |
          . "$HOME/.cargo/env"
          curl -sSfL https://install.arcium.com/ | bash

      - name: Verify Installed Versions
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "=== Rust Version ==="
          rustc --version
          cargo --version
          echo "=== Solana Version ==="
          solana --version
          echo "=== Anchor Version ==="
          anchor --version
          echo "=== Arcium Version ==="
          arcium --version

      - name: Verify Directory Structure
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== Directory Contents ==="
          ls -la
          echo "=== Arcium Directory Check ==="
          if [ -d "arcium/disc_mpc" ]; then
            echo "✓ arcium/disc_mpc exists"
            ls -la arcium/disc_mpc
          else
            echo "✗ arcium/disc_mpc NOT FOUND"
            echo "Available directories:"
            find . -type d -maxdepth 3
            exit 1
          fi

      - name: Generate Program Keypair
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          mkdir -p target/deploy

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          cp target/deploy/disc_mpc-keypair.json program-keypair.json

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          echo "=== Generated Program ID ==="
          echo "$PROGRAM_ID"

      - name: Sync Anchor Program IDs
        run: |
          . "$HOME/.cargo/env"
          cd arcium/disc_mpc
          anchor keys sync

      - name: Build Arcium Program
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          echo "=== Starting Arcium Build ==="
          arcium build
          echo "=== Build Completed Successfully ==="

      - name: Deploy to Devnet
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          echo "=== Starting Deployment ==="
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build
          echo "=== Deployment Completed ==="

      - name: Display Deployment Info
        if: success()
        run: |
          echo "=== Deployment Summary ==="
          echo "Program ID: $PROGRAM_ID"
          echo "Cluster: Devnet"
          echo "Cluster Offset: 456"
          echo "Recovery Set Size: 4"

      - name: Commit and Push Changes
        if: always()
        run: |
          cd /__w/Arciumint/Arciumint
          
          # Check if there are changes
          if [[ -n $(git status --porcelain) ]]; then
            echo "=== Changes detected ==="
            git status
            
            # Add changes
            git add arcium/disc_mpc/target/deploy/*.json || true
            git add arcium/disc_mpc/target/idl/*.json || true
            git add arcium/disc_mpc/target/types/*.ts || true
            git add arcium/disc_mpc/program-keypair.json || true
            
            # Commit
            git commit -m "Deploy: Program ID $PROGRAM_ID to Devnet [skip ci]" || echo "Nothing to commit"
            
            # Push with retry
            echo "=== Pushing changes ==="
            for i in {1..3}; do
              if git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}; then
                echo "✓ Push successful"
                break
              else
                echo "Push attempt $i failed, retrying..."
                sleep 5
              fi
            done
          else
            echo "=== No changes to commit ==="
          fi

      - name: Cleanup on Failure
        if: failure()
        run: |
          echo "=== Build/Deploy Failed ==="
          echo "Check the logs above for error details"
          echo "Common issues:"
          echo "1. RPC connection problems"
          echo "2. Insufficient SOL in wallet"
          echo "3. Network congestion"
          echo "4. Directory structure mismatch"
