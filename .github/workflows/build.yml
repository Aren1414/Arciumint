name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana
        run: |
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Versions
        run: |
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version
          solana --version
          anchor --version
          arcium --version

      - name: Generate Program ID
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile program-keypair.json \
            --force

          PROGRAM_ID=$(solana address -k program-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

          sed -i \
            "s/^disc_mpc = \".*\"/disc_mpc = \"$PROGRAM_ID\"/g" \
            Anchor.toml

          
          sed -i \
            "s/declare_id!(\".*\")/declare_id!(\"$PROGRAM_ID\")/g" \
            programs/src/lib.rs

      - name: Sync Anchor Keypair
        run: |
          cd arcium/disc_mpc
          mkdir -p target/deploy
          cp program-keypair.json target/deploy/disc_mpc-keypair.json

      - name: Generate Cargo.lock
        run: |
          cd arcium/disc_mpc
          cargo generate-lockfile

      - name: Clean Cargo Cache
        run: |
          cd arcium/disc_mpc
          cargo clean

      - name: Build
        run: |
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      - name: Deploy
        run: |
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair program-keypair.json \
            --skip-build

      - name: Test
        run: |
          cd arcium/disc_mpc
          arcium test --cluster devnet

      - name: Commit generated files
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add \
            arcium/disc_mpc/build \
            arcium/disc_mpc/Anchor.toml \
            arcium/disc_mpc/program-keypair.json \
            arcium/disc_mpc/Cargo.lock \
            2>/dev/null || true

          git commit -m "fresh deploy $PROGRAM_ID" \
            2>/dev/null || echo "No changes to commit"

          git push 2>/dev/null || echo "Push failed"
