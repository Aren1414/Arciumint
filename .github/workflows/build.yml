name: Arcium Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      RUSTUP_TOOLCHAIN: nightly
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # =========================
      # Wallet
      # =========================
      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      # =========================
      # Rust (FIXED - CLEAN + NO env injection)
      # =========================
      - name: Install Rust nightly
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env

          rustup toolchain install nightly
          rustup default nightly

          rustup override set nightly || true

          rustc --version
          cargo --version

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # =========================
      # Solana
      # =========================
      - name: Install Solana
        run: |
          curl -sSfL https://solana-install.solana.workers.dev | bash

          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # =========================
      # Arcium
      # =========================
      - name: Install Arcium
        run: |
          curl -sSfL https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # =========================
      # Verify toolchain (CRITICAL)
      # =========================
      - name: Verify toolchain consistency
        run: |
          which cargo
          cargo --version
          rustc --version
          solana --version
          arcium --version

      # =========================
      # CLEAN (IMPORTANT FIX)
      # =========================
      - name: Clean workspace
        run: |
          cd arcium/disc_mpc

          rm -rf build
          rm -rf target
          rm -rf Cargo.lock || true
          cargo clean || true

      # =========================
      # BUILD (IMPORTANT ORDER FIX)
      # =========================
      - name: Arcium build
        run: |
          cd arcium/disc_mpc

          # MUST generate artifacts first
          arcium build --skip-keys-sync

      # =========================
      # VERIFY ARTIFACTS (HARD FAIL IF MISSING)
      # =========================
      - name: Validate build output
        run: |
          test -f arcium/disc_mpc/build/compute_disc.arcis
          test -f arcium/disc_mpc/build/compute_disc.hash

      # =========================
      # DEPLOY
      # =========================
      - name: Deploy
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com

      # =========================
      # COMMIT ARTIFACTS
      # =========================
      - name: Commit build output
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add arcium/disc_mpc/build

          git commit -m "Update Arcium build output" || echo "No changes"
          git push origin HEAD:main
