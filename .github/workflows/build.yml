name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04   

    steps:
      - name: Install system deps (IMPORTANT FIX)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libc6-dev \
            clang \
            llvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (fixed toolchain)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup install 1.75.0
          rustup default 1.75.0
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana (PIN version)
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          rustc --version
          solana --version

      - name: Build
        run: |
          cd arcium/disc_mpc
          cargo clean
          arcium build --skip-keys-sync

      - name: Deploy
        run: |
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --skip-build

      - name: Commit
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add . || true
          git commit -m "fresh deploy" || true
          git push || true
