name: Arcium Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      - name: Restore Solana wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      # 🔥 FIX 1: Use nightly Rust (required for edition2024 deps)
      - name: Install Rust (nightly)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env
          rustup toolchain install nightly
          rustup default nightly
          rustc --version
          cargo --version

      - name: Install Solana
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash

          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Arcium stable install
      - name: Install Arcium
        run: |
          curl -L https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 🔥 IMPORTANT: force correct toolchain for build
      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          solana --version
          arcium --version

      - name: Verify wallet
        run: |
          solana config set --url https://api.devnet.solana.com
          solana address
          solana balance

      - name: Build project
        run: |
          cd arcium/disc_mpc
          rm -rf build
          cargo clean || true
          arcium build --skip-keys-sync

      - name: Deploy project
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com

      - name: Commit and push build directory
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add arcium/disc_mpc/build
          git commit -m "Update Arcium build output" || echo "No changes"
          git push origin HEAD:main
