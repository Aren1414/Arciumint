name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      RUST_BACKTRACE: 1
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C target-cpu=mvp"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            clang llvm gcc curl git cmake

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana (FIXED STABLE TOOLCHAIN)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install --locked anchor-cli --version 1.0.2

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # CRITICAL FIX: prevent SBPF ring crash
      - name: Force SBPF safe build flags
        run: |
          echo "RUSTFLAGS=-C target-cpu=mvp -C link-arg=-z -C link-arg=nostartfiles" >> $GITHUB_ENV
          echo "CARGO_BUILD_JOBS=2" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV

      - name: FULL RESET + Generate Program Keypair
        run: |
          cd arcium/disc_mpc

          rm -rf target .anchor build program-keypair.json

          mkdir -p target/deploy

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          cp target/deploy/disc_mpc-keypair.json program-keypair.json

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

      - name: Sync Program IDs (FIXED localnet)
        run: |
          cd arcium/disc_mpc

          anchor keys sync

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)

          # devnet
          sed -i "s|disc_mpc = \".*\"|disc_mpc = \"$PROGRAM_ID\"|g" Anchor.toml

          # localnet (SAFE replace)
          awk -v id="$PROGRAM_ID" '
            $0 ~ /\[programs.localnet\]/ {print; getline; print "disc_mpc = \"" id "\""; next}
            {print}
          ' Anchor.toml > tmp && mv tmp Anchor.toml

      - name: Build Program (SBPF SAFE)
        run: |
          cd arcium/disc_mpc

          arcium build --skip-keys-sync

      - name: Verify
        run: |
          cd arcium/disc_mpc

          grep disc_mpc Anchor.toml
          solana address -k target/deploy/disc_mpc-keypair.json

      - name: Deploy Program
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build

      - name: Commit Artifacts
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add arcium/disc_mpc || true
          git commit -m "fresh deploy ${PROGRAM_ID:-unknown}" || true
          git push || true
