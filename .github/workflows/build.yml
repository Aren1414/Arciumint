name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      RUST_BACKTRACE: 1
      RUSTFLAGS: "-C target-cpu=generic"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            clang \
            llvm \
            git \
            curl \
            cmake

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          source "$HOME/.cargo/env"
          rustup default stable

      - name: Install Solana CLI v3
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor via AVM
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --locked
          avm install 1.0.2
          avm use 1.0.2

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          arcup update

      - name: Setup wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Prepare program state
        run: |
          cd arcium/disc_mpc

          rm -rf target .anchor build Cargo.lock
          cargo clean

          mkdir -p target/deploy

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          cp target/deploy/disc_mpc-keypair.json program-keypair.json

          anchor keys sync

      - name: Sync Anchor Program ID
        run: |
          cd arcium/disc_mpc

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)

          sed -i "s|disc_mpc = \".*\"|disc_mpc = \"$PROGRAM_ID\"|g" Anchor.toml

          grep disc_mpc Anchor.toml

      - name: Build Program
        run: |
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      - name: Deploy Program
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build

      - name: Commit artifacts
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add arcium/disc_mpc || true
          git commit -m "fresh deploy ${GITHUB_SHA}" || true

      - name: Push changes
        if: always()
        run: |
          git push origin HEAD:${{ github.ref_name }} || true
