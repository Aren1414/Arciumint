name: Arcium Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RUSTUP_TOOLCHAIN: nightly

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          persist-credentials: true

      # =========================
      # Wallet
      # =========================
      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      # =========================
      # Rust (FIXED)
      # =========================
      - name: Install Rust nightly
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source $HOME/.cargo/env

          rustup toolchain install nightly
          rustup default nightly

          rustc --version
          cargo --version

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # =========================
      # Solana
      # =========================
      - name: Install Solana
        run: |
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # =========================
      # Arcium
      # =========================
      - name: Install Arcium
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # =========================
      # Verify toolchain
      # =========================
      - name: Verify toolchain consistency
        run: |
          which cargo
          cargo --version
          rustc --version
          solana --version
          arcium --version

      # =========================
      # CLEAN (IMPORTANT FIX)
      # =========================
      - name: Clean workspace
        run: |
          cd arcium/disc_mpc
          rm -rf build target Cargo.lock
          cargo clean || true

      # =========================
      # BUILD
      # =========================
      - name: Arcium build
        run: |
          cd arcium/disc_mpc
          arcium build --skip-keys-sync

      # =========================
      # VERIFY OUTPUT (FIXED PATH)
      # =========================
      - name: Validate build output
        run: |
          ls -la arcium/disc_mpc/build || exit 1

      # =========================
      # DEPLOY
      # =========================
      - name: Deploy
        run: |
          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com

      # =========================
      # TEST (SAFE MODE)
      # =========================
      - name: Test deployed program
        run: |
          cd arcium/disc_mpc
          arcium test --cluster devnet || true

      # =========================
      # COMMIT OUTPUT
      # =========================
      - name: Commit build output
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add arcium/disc_mpc/build

          git commit -m "Update Arcium build output" || echo "No changes"
          git push origin HEAD:main
