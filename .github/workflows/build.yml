name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # WALLET
      # =========================
      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      # =========================
      # RUST
      # =========================
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y

          source $HOME/.cargo/env

          rustup toolchain install nightly
          rustup default nightly

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      # =========================
      # SOLANA
      # =========================
      - name: Install Solana
        run: |
          curl -sSfL https://solana-install.solana.workers.dev | bash

          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # =========================
      # ARCIUM
      # =========================
      - name: Install Arcium
        run: |
          curl -sSfL https://install.arcium.com/ | bash

          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # =========================
      # VERIFY
      # =========================
      - name: Verify versions
        run: |
          source $HOME/.cargo/env

          rustc --version
          cargo --version
          solana --version
          arcium --version

      # =========================
      # CLEAN OLD LOCKFILE
      # =========================
      - name: Remove Cargo.lock
        run: |
          rm -f arcium/disc_mpc/Cargo.lock

      # =========================
      # GENERATE NEW PROGRAM ID
      # =========================
      - name: Generate Program ID
        run: |
          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile program-keypair.json

          PROGRAM_ID=$(solana address -k program-keypair.json)

          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

          echo "Generated Program ID:"
          echo $PROGRAM_ID

      # =========================
      # UPDATE Anchor.toml
      # =========================
      - name: Update Anchor.toml
        run: |
          sed -i "s/^disc_mpc = \".*\"/disc_mpc = \"$PROGRAM_ID\"/g" arcium/disc_mpc/Anchor.toml

      # =========================
      # UPDATE declare_id
      # =========================
      - name: Update Rust declare_id
        run: |
          sed -i "s/declare_id!(\".*\")/declare_id!(\"$PROGRAM_ID\")/g" arcium/disc_mpc/programs/src/lib.rs

      # =========================
      # CLEAN TARGET
      # =========================
      - name: Clean target
        run: |
          cd arcium/disc_mpc

          rm -rf target
          rm -rf build

          cargo clean || true

      # =========================
      # BUILD
      # =========================
      - name: Build
        run: |
          source $HOME/.cargo/env

          cd arcium/disc_mpc

          arcium build --skip-keys-sync

      # =========================
      # VERIFY BUILD
      # =========================
      - name: Verify artifacts
        run: |
          test -f arcium/disc_mpc/build/compute_disc.arcis
          test -f arcium/disc_mpc/build/compute_disc.hash

      # =========================
      # DEPLOY
      # =========================
      - name: Deploy
        run: |
          source $HOME/.cargo/env

          cd arcium/disc_mpc

          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com

      # =========================
      # COMMIT
      # =========================
      - name: Commit generated files
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add .

          git commit -m "fresh deploy $PROGRAM_ID" || echo "No changes"

          git push
