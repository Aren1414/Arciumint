name: Arcium Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install Solana + Anchor + Surfpool (Solana dev skill)
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Arcium toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Arcium (correct workspace)
        run: |
          cd arcium/disc_mpc
          solana --version
          anchor --version
          arcium --version
          arcium build --skip-keys-sync

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arcium-build
          path: arcium/disc_mpc/build

      - name: Commit and push build output to repo
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          cp -r arcium/disc_mpc/build ./arcium_build_output

          git add arcium_build_output
          git commit -m "Auto-update Arcium build output" || echo "No changes to commit"
          git push
