name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup default stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Solana
        run: |
          curl -sSfL https://solana-install.solana.workers.dev | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Arcium CLI
        run: |
          curl -sSfL https://install.arcium.com/ | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify Versions
        run: |
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version
          solana --version
          anchor --version
          arcium --version

      - name: Prepare Program Keypair
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          mkdir -p target/deploy
          rm -f target/deploy/disc_mpc-keypair.json
          rm -f program-keypair.json

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          cp target/deploy/disc_mpc-keypair.json program-keypair.json

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV

      - name: Sync Anchor Program IDs
        run: |
          cd arcium/disc_mpc
          anchor keys sync

      - name: Generate Cargo.lock
        run: |
          cd arcium/disc_mpc
          cargo generate-lockfile

      - name: Clean Build Cache
        run: |
          cd arcium/disc_mpc
          cargo clean

      - name: Build
        run: |
          cd arcium/disc_mpc
          mkdir -p target/deploy
          cp program-keypair.json target/deploy/disc_mpc-keypair.json
          arcium build --skip-keys-sync

      - name: Deploy
        run: |
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build

      - name: Test
        run: |
          cd arcium/disc_mpc
          arcium test --cluster devnet

      - name: Commit generated files
        if: always()
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add \
            arcium/disc_mpc/build \
            arcium/disc_mpc/Anchor.toml \
            arcium/disc_mpc/program-keypair.json \
            arcium/disc_mpc/Cargo.lock \
            arcium/disc_mpc/target/deploy \
            2>/dev/null || true

          git commit -m "fresh deploy ${PROGRAM_ID:-unknown}" \
            2>/dev/null || echo "No changes to commit"

          git push 2>/dev/null || echo "Push failed"
