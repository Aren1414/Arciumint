name: Arcium Build Fresh Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --user root

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libc6-dev \
            libc6-dev-i386 \
            linux-libc-dev \
            libudev-dev \
            clang \
            llvm \
            ca-certificates

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global --add safe.directory /__w/Arciumint/Arciumint
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Setup Solana Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env"
          echo 'source $HOME/.cargo/env' >> ~/.bashrc

      - name: Install Solana 3.1.10
        run: |
          . "$HOME/.cargo/env"
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.10/install)"

      - name: Install Anchor 1.0.2
        run: |
          . "$HOME/.cargo/env"
          cargo install --locked anchor-cli --version 1.0.2

      - name: Install Arcium CLI (official binary method)
        run: |
          . "$HOME/.cargo/env"
          ARCIUM_VERSION="0.10.2"
          curl -L "https://github.com/arcium/arcium/releases/download/v${ARCIUM_VERSION}/arcium-x86_64-unknown-linux-gnu" -o /usr/local/bin/arcium
          chmod +x /usr/local/bin/arcium

      - name: Verify Versions
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          rustc --version
          solana --version
          anchor --version
          arcium --version

      - name: Verify Directory
        run: |
          echo "=== Current Directory ==="
          pwd
          ls -la
          if [ -d "arcium/disc_mpc" ]; then
            echo "✓ arcium/disc_mpc found"
          else
            echo "✗ arcium/disc_mpc NOT FOUND"
            find . -type d -maxdepth 3
            exit 1
          fi

      - name: Generate Program Keypair
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          mkdir -p target/deploy

          solana-keygen new \
            --silent \
            --no-bip39-passphrase \
            --outfile target/deploy/disc_mpc-keypair.json \
            --force

          PROGRAM_ID=$(solana address -k target/deploy/disc_mpc-keypair.json)
          echo "PROGRAM_ID=$PROGRAM_ID" >> $GITHUB_ENV
          echo "Program ID: $PROGRAM_ID"

      - name: Sync Program IDs
        run: |
          . "$HOME/.cargo/env"
          cd arcium/disc_mpc
          anchor keys sync

      - name: Build Program
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          arcium build

      - name: Deploy to Devnet
        run: |
          . "$HOME/.cargo/env"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cd arcium/disc_mpc
          arcium deploy \
            --cluster-offset 456 \
            --recovery-set-size 4 \
            --keypair-path ~/.config/solana/id.json \
            --rpc-url https://api.devnet.solana.com \
            --program-keypair target/deploy/disc_mpc-keypair.json \
            --skip-build

      - name: Show Results
        if: success()
        run: |
          echo "=== Success ==="
          echo "Program ID: $PROGRAM_ID"
          echo "Cluster: Devnet (456)"

      - name: Commit Changes
        if: always()
        run: |
          cd /__w/Arciumint/Arciumint
          
          if [[ -n $(git status --porcelain) ]]; then
            git add arcium/disc_mpc/target/deploy/*.json || true
            git add arcium/disc_mpc/target/idl/*.json || true
            git add arcium/disc_mpc/target/types/*.ts || true
            
            git commit -m "Deploy $PROGRAM_ID [skip ci]" || true
            
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }} || true
          fi
