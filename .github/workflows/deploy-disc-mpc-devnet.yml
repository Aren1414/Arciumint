name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "2.3.0"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"
      ARCIUM_CLUSTER_OFFSET: "123"   

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # System dependencies
      # -----------------------------
      - name: System dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq curl ca-certificates

      # -----------------------------
      # Rust 1.85.0
      # -----------------------------
      - name: Install Rust 1.85.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version
          cargo --version

      # -----------------------------
      # Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:$PATH"
          solana --version
          solana config set --url "${SOLANA_RPC_URL}"

      # -----------------------------
      # Wallets
      # -----------------------------
      - name: Wallets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/solana arcium/disc_mpc/target/deploy
          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          chmod 600 ~/.config/solana/id.json arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          solana config set --keypair ~/.config/solana/id.json
          solana balance || true

      # -----------------------------
      # Node / Yarn
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      # -----------------------------
      # Anchor (AVM pinned 0.32.1)
      # -----------------------------
      - name: Install Anchor
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Arcium CLI
      # -----------------------------
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o /tmp/arcium
          chmod +x /tmp/arcium
          sudo mv /tmp/arcium /usr/local/bin/arcium
          arcium --version

      # -----------------------------
      # BUILD CONFIDENTIAL IXs
      # -----------------------------
      - name: Arcium Build (generate *.arcis)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
          yarn install
          arcium build --skip-keys-sync

      # -----------------------------
      # DEPLOY (PROGRAM + MXE INIT)  
      # -----------------------------
      - name: Arcium Deploy (Devnet)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:/usr/local/bin:$PATH"

          arcium deploy \
            --cluster-offset ${ARCIUM_CLUSTER_OFFSET} \
            --keypair-path /home/runner/.config/solana/id.json \
            --rpc-url "${SOLANA_RPC_URL}" \
            --program-keypair ./target/deploy/disc_mpc-keypair.json
