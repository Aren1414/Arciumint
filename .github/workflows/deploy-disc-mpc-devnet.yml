name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "1.18.26"
      SOLANA_RPC_URL: https://api.devnet.solana.com

    steps:
      # --------------------------------------------------
      # 1) Checkout repo
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2) Install system dependencies (REQUIRED for Anchor)
      # --------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev

      # --------------------------------------------------
      # 3) Install Solana CLI
      # --------------------------------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -e
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version
          solana-keygen --version

      # --------------------------------------------------
      # 4) Write keypairs from GitHub Secrets
      # --------------------------------------------------
      - name: Write Solana keypairs
        shell: bash
        run: |
          set -e
          mkdir -p ~/.config/solana
          mkdir -p arcium/disc_mpc/target/deploy

          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json
          chmod 600 arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          solana config set --url "${SOLANA_RPC_URL}"
          solana config set --keypair ~/.config/solana/id.json
          solana config get

          solana-keygen pubkey ~/.config/solana/id.json
          solana-keygen pubkey arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

      # --------------------------------------------------
      # 5) Airdrop SOL (best effort)
      # --------------------------------------------------
      - name: Airdrop SOL
        shell: bash
        run: |
          solana airdrop 2 || solana airdrop 1 || true
          solana balance || true

      # --------------------------------------------------
      # 6) Install Rust toolchain (MATCH rust-toolchain.toml)
      # --------------------------------------------------
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      # --------------------------------------------------
      # 7) Install Node + Yarn
      # --------------------------------------------------
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack (Yarn)
        shell: bash
        run: |
          corepack enable
          yarn --version

      # --------------------------------------------------
      # 8) Install Anchor CLI
      # --------------------------------------------------
      - name: Install Anchor CLI
        shell: bash
        run: |
          set -e
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli
          anchor --version

      # --------------------------------------------------
      # 9) Build & Deploy DISC MPC program (FIXED)
      # --------------------------------------------------
      - name: Build & Deploy (Anchor)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          set -e

          echo ">>> REMOVE Cargo.lock (Anchor incompatibility fix)"
          find . -name Cargo.lock -delete

          yarn install --frozen-lockfile || yarn install
          anchor build
          anchor deploy --provider.cluster devnet

      # --------------------------------------------------
      # 10) OPTIONAL – init computation definition (ONCE)
      # --------------------------------------------------
      - name: Init computation definition (optional)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          echo "Init step skipped"
