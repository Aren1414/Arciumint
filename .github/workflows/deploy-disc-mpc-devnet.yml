name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "1.18.26"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # Rust only needed to install avm (and other rust tooling)
      - name: Install Rust (stable)
        run: |
          set -euo pipefail
          rustup toolchain install stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install Solana CLI
        run: |
          set -euo pipefail
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version

      - name: Write Solana keypairs
        run: |
          set -euo pipefail
          mkdir -p ~/.config/solana
          mkdir -p arcium/disc_mpc/target/deploy

          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json
          chmod 600 arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          solana config set --url "${SOLANA_RPC_URL}"
          solana config set --keypair ~/.config/solana/id.json

      - name: Airdrop SOL
        run: |
          set -euo pipefail
          solana airdrop 2 || solana airdrop 1 || true
          solana balance || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      - name: Install Anchor via AVM (pinned 0.32.1)
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      - name: Build & Deploy (Anchor)
        working-directory: arcium/disc_mpc
        run: |
          set -euo pipefail
          yarn install

          # Ensure Cargo.lock files do not break Solana's cargo-build-sbf tooling
          find .. -name Cargo.lock -print -delete || true

          anchor build --skip-lint
          anchor deploy --provider.cluster devnet
