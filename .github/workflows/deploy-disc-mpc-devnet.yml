name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "1.18.26"
      SOLANA_RPC_URL: https://api.devnet.solana.com

    steps:
      # --------------------------------------------------
      # 1) Checkout
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2) System deps (required for Anchor / hidapi)
      # --------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # --------------------------------------------------
      # 3) Solana CLI
      # --------------------------------------------------
      - name: Install Solana CLI
        shell: bash
        run: |
          set -e
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version
          solana-keygen --version

      # --------------------------------------------------
      # 4) Restore keypairs from secrets
      # --------------------------------------------------
      - name: Write Solana keypairs
        shell: bash
        run: |
          set -e
          mkdir -p ~/.config/solana
          mkdir -p arcium/disc_mpc/target/deploy

          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json
          chmod 600 arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          solana config set --url "${SOLANA_RPC_URL}"
          solana config set --keypair ~/.config/solana/id.json
          solana config get

          solana-keygen pubkey ~/.config/solana/id.json
          solana-keygen pubkey arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

      # --------------------------------------------------
      # 5) Airdrop (best effort)
      # --------------------------------------------------
      - name: Airdrop SOL
        shell: bash
        run: |
          solana airdrop 2 || solana airdrop 1 || true
          solana balance || true

      # --------------------------------------------------
      # 6) Rust toolchain (EXACT project version)
      # --------------------------------------------------
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy

      # --------------------------------------------------
      # 7) Node + Yarn
      # --------------------------------------------------
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          yarn --version

      # --------------------------------------------------
      # 8) Anchor CLI
      # --------------------------------------------------
      - name: Install Anchor CLI
        shell: bash
        run: |
          set -e
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli
          anchor --version

      # --------------------------------------------------
      # 9) Build & Deploy (FINAL FIX)
      # --------------------------------------------------
      - name: Build & Deploy DISC MPC
        shell: bash
        working-directory: arcium/disc_mpc
        env:
          CARGO_IGNORE_LOCKFILE: "1"
        run: |
          set -e

          echo ">>> Disable Cargo.lock entirely"
          find . -name Cargo.lock -delete

          yarn install
          anchor build
          anchor deploy --provider.cluster devnet

      # --------------------------------------------------
      # 10) Optional init (run once)
      # --------------------------------------------------
      - name: Init computation definition (optional)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          echo "Init skipped"
