name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "1.18.26"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq

      - name: Rust 1.83.0 (host toolchain)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.83.0 --profile minimal
          rustup default 1.83.0
          rustc --version
          cargo --version

      - name: Solana CLI (pinned)
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana config set --url "${SOLANA_RPC_URL}"
          solana --version

      - name: Write keypairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/solana
          mkdir -p arcium/disc_mpc/target/deploy

          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json
          chmod 600 arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          solana config set --keypair ~/.config/solana/id.json
          solana address
          solana balance || true

      - name: Airdrop (optional)
        shell: bash
        run: |
          set -euo pipefail
          solana airdrop 1 || true
          solana balance || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      - name: Anchor (AVM pinned 0.32.1)
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      - name: Build & Deploy
        shell: bash
        working-directory: arcium/disc_mpc
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
        run: |
          set -euo pipefail
          yarn install
          anchor build --skip-lint
          anchor deploy --provider.cluster devnet
