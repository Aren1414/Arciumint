name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: v1.18.26
      SOLANA_RPC_URL: https://api.devnet.solana.com

    steps:
      - uses: actions/checkout@v4

      # --- Install Solana (OFFICIAL way) ---
      - name: Install Solana Toolchain
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version

      # --- Restore wallet ---
      - name: Restore Solana wallet
        run: |
          mkdir -p ~/.config/solana
          echo "${SOLANA_WALLET_KEYPAIR}" > ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json
          solana config set --url ${SOLANA_RPC_URL}
        env:
          SOLANA_WALLET_KEYPAIR: ${{ secrets.SOLANA_WALLET_KEYPAIR }}

      # --- Airdrop ---
      - name: Airdrop SOL
        run: |
          solana airdrop 2 || solana airdrop 1 || true
          solana balance

      # --- Restore program keypair ---
      - name: Restore program keypair
        run: |
          mkdir -p arcium/disc_mpc/target/deploy
          echo "${DISC_MPC_PROGRAM_KEYPAIR}" > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
        env:
          DISC_MPC_PROGRAM_KEYPAIR: ${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}

      # --- Build BPF (THIS IS THE ONLY VALID WAY) ---
      - name: Build BPF program
        working-directory: arcium/disc_mpc
        run: |
          cargo build-bpf

      # --- Deploy ---
      - name: Deploy program
        working-directory: arcium/disc_mpc
        run: |
          solana program deploy target/deploy/disc_mpc.so
