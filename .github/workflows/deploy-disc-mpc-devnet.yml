name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "1.18.26"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      # اگر هنوز توی ریشه repo rust-toolchain داری، همین باعث lock v4 می‌شود.
      - name: Remove repo-level rust-toolchain overrides (if any)
        shell: bash
        run: |
          set -euo pipefail
          rm -f rust-toolchain rust-toolchain.toml || true

      - name: Install Rust toolchains (host + lockfile)
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.83.0
          rustup toolchain install 1.75.0
          rustup default 1.83.0
          rustc --version
          cargo --version

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version
          solana config set --url "${SOLANA_RPC_URL}"

      - name: Write Solana keypairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/solana
          mkdir -p arcium/disc_mpc/target/deploy

          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json
          chmod 600 arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          solana config set --keypair ~/.config/solana/id.json
          solana address
          solana balance || true

      - name: Airdrop SOL
        shell: bash
        run: |
          set -euo pipefail
          solana airdrop 2 || solana airdrop 1 || true
          solana balance || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      # به جای cargo install anchor-cli از سورس (که msrv می‌ترکاند)، avm نصب کن
      - name: Install Anchor via AVM (0.32.1)
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # نکته کلیدی: lockfile را با cargo قدیمی تولید کن تا Solana cargo-build-sbf بتواند بخواند
      - name: Generate compatible Cargo.lock (v3) for Solana tooling
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          set -euo pipefail
          rm -f Cargo.lock
          cargo +1.75.0 generate-lockfile
          # sanity check:
          grep -n "^version" Cargo.lock | head -n 1 || true

      - name: Build & Deploy (Anchor)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          set -euo pipefail
          yarn install
          anchor build --skip-lint
          anchor deploy --provider.cluster devnet
