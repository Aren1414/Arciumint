name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "2.3.0"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: System dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq curl ca-certificates

      - name: Install Rust 1.85.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version
          cargo --version

      - name: Install Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:$PATH"
          solana --version
          solana config set --url "${SOLANA_RPC_URL}"

      - name: Wallets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/solana arcium/disc_mpc/target/deploy
          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          chmod 600 ~/.config/solana/id.json arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          solana config set --keypair ~/.config/solana/id.json
          solana balance || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      - name: Install Anchor (AVM pinned 0.32.1)
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      - name: Clean surfpool (avoid version mismatch)
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /usr/local/bin/surfpool || true
          rm -f "$HOME/.local/bin/surfpool" || true

      - name: Build & Deploy
        shell: bash
        working-directory: arcium/disc_mpc
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$HOME/.local/bin:/usr/local/bin:$PATH"
          yarn install
          anchor build --skip-lint
          anchor deploy --provider.cluster devnet
