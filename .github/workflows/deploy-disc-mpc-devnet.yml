name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "1.18.26"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # System deps
      # -----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq

      # -----------------------------
      # Rust (nightly required by deps)
      # -----------------------------
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustc --version
          cargo --version

      # -----------------------------
      # Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        run: |
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana config set --url "${SOLANA_RPC_URL}"
          solana --version

      # -----------------------------
      # Wallets
      # -----------------------------
      - name: Write Solana keypairs
        run: |
          mkdir -p ~/.config/solana arcium/disc_mpc/target/deploy
          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          chmod 600 ~/.config/solana/id.json arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          solana config set --keypair ~/.config/solana/id.json

      # -----------------------------
      # Node / Yarn
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: |
          corepack enable
          yarn --version

      # -----------------------------
      # Anchor (AVM pinned)
      # -----------------------------
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Generate Cargo.lock via CI (ONLY PLACE)
      # -----------------------------
      - name: Generate Cargo.lock (CI owned)
        working-directory: arcium/disc_mpc
        run: |
          cargo generate-lockfile

      # -----------------------------
      # Commit Cargo.lock if changed
      # -----------------------------
      - name: Commit Cargo.lock if changed
        working-directory: arcium/disc_mpc
        run: |
          if git status --porcelain | grep Cargo.lock; then
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add Cargo.lock
            git commit -m "ci: update Cargo.lock (anchor/solana compatible)"
            git push
          else
            echo "Cargo.lock unchanged"
          fi

      # -----------------------------
      # Build & Deploy
      # -----------------------------
      - name: Build & Deploy
        working-directory: arcium/disc_mpc
        env:
          ANCHOR_PROVIDER_URL: https://api.devnet.solana.com
          ANCHOR_WALLET: /home/runner/.config/solana/id.json
        run: |
          yarn install
          anchor build --skip-lint
          anchor deploy --provider.cluster devnet
