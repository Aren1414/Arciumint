name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      ARCIUM_CLUSTER_OFFSET: "123"
      SOLANA_RPC_URL: "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}"
      SOLANA_VERSION: "v1.18.18"

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # System deps
      # -----------------------------
      - name: System dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            jq \
            curl \
            ca-certificates \
            xz-utils

      # -----------------------------
      # Rust
      # -----------------------------
      - name: Install Rust 1.85.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version

      # -----------------------------
      # Solana CLI (NO installer, NO SSL issue)
      # -----------------------------
      - name: Install Solana CLI (GitHub release tarball)
        shell: bash
        run: |
          set -euo pipefail

          SOLANA_URL="https://github.com/solana-labs/solana/releases/download/${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"

          curl -L --retry 5 --retry-delay 5 \
            "$SOLANA_URL" \
            -o solana.tar.bz2

          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/

          solana --version
          solana config set --url "${SOLANA_RPC_URL}"

      # -----------------------------
      # Wallets
      # -----------------------------
      - name: Wallets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/solana arcium/disc_mpc/target/deploy

          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          solana config set --keypair ~/.config/solana/id.json
          solana balance || true

      # -----------------------------
      # Node / Yarn
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Yarn
        shell: bash
        run: |
          corepack enable
          yarn --version

      # -----------------------------
      # Anchor
      # -----------------------------
      - name: Install Anchor (0.32.1)
        shell: bash
        run: |
          set -euo pipefail
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Arcium CLI
      # -----------------------------
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o /tmp/arcium
          chmod +x /tmp/arcium
          sudo mv /tmp/arcium /usr/local/bin/arcium
          arcium --version

      # -----------------------------
      # Build *.arcis
      # -----------------------------
      - name: Arcium Build
        working-directory: arcium/disc_mpc
        shell: bash
        run: |
          set -euo pipefail
          yarn install
          arcium build --skip-keys-sync

      # -----------------------------
      # Deploy program only
      # -----------------------------
      - name: Arcium Deploy (Devnet)
        working-directory: arcium/disc_mpc
        shell: bash
        run: |
          set -euo pipefail
          arcium deploy \
            --cluster-offset "${ARCIUM_CLUSTER_OFFSET}" \
            --mempool-size Small \
            --recovery-set-size 1 \
            --keypair-path "$HOME/.config/solana/id.json" \
            --program-keypair "./target/deploy/disc_mpc-keypair.json" \
            --program-name disc_mpc \
            --rpc-url "${SOLANA_RPC_URL}" \
            --skip-init
