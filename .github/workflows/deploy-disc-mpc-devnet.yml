name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Solana CLI (official installer)
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/v1.18.26/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          solana --version
          solana-keygen --version

      - name: Restore Solana wallet + set devnet
        run: |
          mkdir -p ~/.config/solana
          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json
          solana config set --url https://api.devnet.solana.com
          solana address
          solana balance

      - name: Airdrop devnet SOL
        run: |
          solana airdrop 2 || solana airdrop 1 || true
          solana balance

      - name: Restore program keypair
        run: |
          mkdir -p arcium/disc_mpc/target/deploy
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' \
            > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

      - name: Remove Cargo.lock (CRITICAL)
        run: |
          rm -f arcium/disc_mpc/Cargo.lock

      - name: Build DISC MPC program (SBF)
        working-directory: arcium/disc_mpc
        run: |
          cargo build-bpf

      - name: Deploy DISC MPC program to devnet
        working-directory: arcium/disc_mpc
        run: |
          solana program deploy \
            target/deploy/disc_mpc.so \
            --program-id target/deploy/disc_mpc-keypair.json
