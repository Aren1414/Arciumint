name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "2.3.0"
      ARCIUM_CLUSTER_OFFSET: "123"

    steps:
      - uses: actions/checkout@v4

      # Solana
      - name: Install Solana
        shell: bash
        run: |
          set -e
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      # Node + Yarn (اجباری)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        shell: bash
        run: |
          corepack enable
          yarn --version

      # Wallets
      - name: Wallets
        shell: bash
        run: |
          set -e
          mkdir -p ~/.config/solana arcium/disc_mpc/target/deploy
          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          chmod 600 ~/.config/solana/id.json arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

      # Arcium CLI
      - name: Install Arcium
        shell: bash
        run: |
          set -e
          curl -fL https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o /tmp/arcium
          chmod +x /tmp/arcium
          sudo mv /tmp/arcium /usr/local/bin/arcium
          arcium --version

      # BUILD (خیلی مهم)
      - name: Arcium Build
        working-directory: arcium/disc_mpc
        shell: bash
        run: |
          set -e
          yarn install
          arcium build --skip-keys-sync

      # DEPLOY
      - name: Arcium Deploy
        working-directory: arcium/disc_mpc
        shell: bash
        run: |
          set -e
          arcium deploy \
            --cluster-offset 123 \
            --keypair-path ~/.config/solana/id.json \
            --program-keypair ./target/deploy/disc_mpc-keypair.json \
            --mempool-size Small \
            --recovery-set-size 1 \
            --rpc-url "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_DEVNET_RPC }}"
