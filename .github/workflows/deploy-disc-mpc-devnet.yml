name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

env:
  SOLANA_VERSION: "1.18.26"
  SOLANA_RPC_URL: "https://api.devnet.solana.com"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------
      # Install Rust (Anchor-compatible)
      # -------------------------------
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.81.0"
          components: rustfmt, clippy

      # -------------------------------
      # Install Node + Yarn
      # -------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      # -------------------------------
      # Install Solana CLI (binary)
      # -------------------------------
      - name: Install Solana CLI
        run: |
          curl -L https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version

      # -------------------------------
      # Restore Solana keypair from secret
      # -------------------------------
      - name: Setup Solana wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_ID_JSON }}' > ~/.config/solana/id.json
          solana config set --url ${SOLANA_RPC_URL}
          solana config set --keypair ~/.config/solana/id.json
          solana balance || true

      # -------------------------------
      # Airdrop (best effort)
      # -------------------------------
      - name: Airdrop SOL (devnet)
        run: |
          solana airdrop 2 || solana airdrop 1 || true
          solana balance

      # -------------------------------
      # Install Anchor CLI
      # -------------------------------
      - name: Install Anchor CLI
        run: |
          cargo install anchor-cli --version 0.32.1 --locked
          anchor --version

      # -------------------------------
      # Build + Deploy program
      # -------------------------------
      - name: Build & Deploy DISC MPC program
        working-directory: arcium/disc_mpc
        run: |
          anchor build
          anchor deploy --provider.cluster devnet

      # -------------------------------
      # Init computation definition (REQUIRED)
      # -------------------------------
      - name: Init DISC computation definition
        working-directory: arcium/disc_mpc
        run: |
          yarn install --frozen-lockfile
          yarn ts-node scripts/init-devnet.ts
