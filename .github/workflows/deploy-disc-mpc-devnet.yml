name: Deploy DISC MPC Program (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "1.18.26"
      SOLANA_RPC_URL: "https://api.devnet.solana.com"
      CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
      RUSTUP_TOOLCHAIN: nightly   # <<< حیاتی

    steps:
      - uses: actions/checkout@v4

      # -----------------------------
      # System deps
      # -----------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev jq

      # -----------------------------
      # Rust (NIGHTLY ONLY – DO NOT MIX)
      # -----------------------------
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly
          rustup default nightly
          rustc --version
          cargo --version

      # -----------------------------
      # Solana CLI
      # -----------------------------
      - name: Install Solana CLI
        run: |
          curl -L "https://github.com/solana-labs/solana/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version
          solana config set --url "${SOLANA_RPC_URL}"

      # -----------------------------
      # Wallets
      # -----------------------------
      - name: Write Solana keypairs
        run: |
          mkdir -p ~/.config/solana
          mkdir -p arcium/disc_mpc/target/deploy

          echo '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          echo '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json
          chmod 600 arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          solana config set --keypair ~/.config/solana/id.json
          solana balance || true

      # -----------------------------
      # Node / Yarn
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        run: |
          corepack enable
          yarn --version

      # -----------------------------
      # Anchor (AVM pinned)
      # -----------------------------
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1
          avm use 0.32.1
          anchor --version

      # -----------------------------
      # Build & Deploy
      # -----------------------------
      - name: Build & Deploy
        working-directory: arcium/disc_mpc
        run: |
          yarn install
          rm -f Cargo.lock
          anchor build --skip-lint
          anchor deploy --provider.cluster devnet
