name: Deploy DISC MPC Program + Init (Devnet)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SOLANA_VERSION: "2.3.0"
      ANCHOR_VERSION: "0.32.1"
      ARCIUM_CLUSTER_OFFSET: "123"
      SOLANA_RPC_URL: "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}"

      CARGO_NET_GIT_FETCH_WITH_CLI: "true"

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # System deps
      # -----------------------------
      - name: System dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libudev-dev jq curl ca-certificates xz-utils bzip2 git

      # -----------------------------
      # Rust
      # -----------------------------
      - name: Install Rust 1.85.0
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          rustc --version
          cargo --version

      # -----------------------------
      # Solana CLI
      # -----------------------------
      - name: Install Solana CLI (Anza/Agave v${{ env.SOLANA_VERSION }})
        shell: bash
        run: |
          set -euo pipefail

          TARBALL_URL="https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"

          if curl -L --fail \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 600 \
              "$TARBALL_URL" -o solana.tar.bz2; then
            tar -xjf solana.tar.bz2
            sudo mv solana-release/bin/* /usr/local/bin/
          else
            curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" | bash
            echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
            sudo ln -sf "$(which solana)" /usr/local/bin/solana
          fi

          solana --version
          solana config set --url "${SOLANA_RPC_URL}"

      # -----------------------------
      # Wallets
      # -----------------------------
      - name: Wallets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.config/solana arcium/disc_mpc/target/deploy

          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          printf '%s' '${{ secrets.DISC_MPC_PROGRAM_KEYPAIR }}' > arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

          chmod 600 ~/.config/solana/id.json arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          solana config set --keypair ~/.config/solana/id.json
          solana balance || true

      # -----------------------------
      # Node / Yarn
      # -----------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Yarn
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          yarn --version

      # -----------------------------
      # Anchor CLI
      # -----------------------------
      - name: Install Anchor CLI (v${{ env.ANCHOR_VERSION }})
        shell: bash
        run: |
          set -euo pipefail

          ANCHOR_URL="https://github.com/coral-xyz/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"

          if curl -L --fail \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --connect-timeout 30 --max-time 600 \
              "$ANCHOR_URL" -o /tmp/anchor; then
            chmod +x /tmp/anchor
            sudo mv /tmp/anchor /usr/local/bin/anchor
          else
            cargo install --git https://github.com/coral-xyz/anchor --tag "v${ANCHOR_VERSION}" anchor-cli --locked --force
            sudo ln -sf "$HOME/.cargo/bin/anchor" /usr/local/bin/anchor
          fi

          anchor --version

      # -----------------------------
      # Arcium CLI
      # -----------------------------
      - name: Install Arcium CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o /tmp/arcium
          chmod +x /tmp/arcium
          sudo mv /tmp/arcium /usr/local/bin/arcium
          arcium --version

      # -----------------------------
      # Build
      # -----------------------------
      - name: Arcium Build (generate *.arcis)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          set -euo pipefail
          yarn install
          arcium build --skip-keys-sync

      # -----------------------------
      # Deploy + INIT (ONLY ONCE)
      # -----------------------------
      - name: Arcium Deploy (Devnet – INIT + program)
        shell: bash
        working-directory: arcium/disc_mpc
        run: |
          set -euo pipefail

          arcium deploy \
            --cluster-offset "${ARCIUM_CLUSTER_OFFSET}" \
            --mempool-size Small \
            --recovery-set-size 1 \
            --keypair-path "$HOME/.config/solana/id.json" \
            --program-keypair "./target/deploy/disc_mpc-keypair.json" \
            --program-name disc_mpc \
            --rpc-url "${SOLANA_RPC_URL}"
