name: Init DISC MPC (Devnet)

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest

    env:
      ANCHOR_PROVIDER_URL: "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}"
      ANCHOR_WALLET: "/home/runner/.config/solana/id.json"
      ANCHOR_DISABLE_PROGRAM_ID_SYNC: "1"

    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev curl jq ca-certificates

      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0

      - name: Install Solana
        run: |
          curl -sSfL https://release.anza.xyz/v2.3.0/install | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Yarn
        run: |
          corepack enable
          yarn --version

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.32.1 anchor-cli --locked --force
          anchor --version

      - name: Install Arcium CLI
        run: |
          curl -fL https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o /tmp/arcium
          chmod +x /tmp/arcium
          sudo mv /tmp/arcium /usr/local/bin/arcium
          arcium --version

      - name: Install JS deps
        working-directory: arcium/disc_mpc
        run: yarn install

      - name: Arcium Build (generate *.arcis)
        working-directory: arcium/disc_mpc
        run: arcium build --skip-keys-sync

      - name: Init compute_disc comp def
        working-directory: arcium/disc_mpc
        run: npx ts-node scripts/init-devnet.ts
