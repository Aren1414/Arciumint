name: Generate Solana Keypairs (ONE TIME)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Solana CLI
        run: |
          SOLANA_VERSION=1.18.26
          curl -L https://github.com/solana-labs/solana/releases/download/v$SOLANA_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o solana.tar.bz2
          tar -xjf solana.tar.bz2
          sudo mv solana-release/bin/* /usr/local/bin/
          solana --version
          solana-keygen --version

      - name: Generate solana wallet keypair (id.json)
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            -o ~/.config/solana/id.json

      - name: Generate disc_mpc program keypair
        run: |
          mkdir -p arcium/disc_mpc/target/deploy
          solana-keygen new \
            --no-bip39-passphrase \
            --silent \
            -o arcium/disc_mpc/target/deploy/disc_mpc-keypair.json

      - name: PRINT WALLET KEYPAIR (COPY THIS)
        run: |
          echo "===== SOLANA_WALLET_KEYPAIR ====="
          cat ~/.config/solana/id.json
          echo ""
          echo "================================"

      - name: PRINT PROGRAM KEYPAIR (COPY THIS)
        run: |
          echo "===== DISC_MPC_PROGRAM_KEYPAIR ====="
          cat arcium/disc_mpc/target/deploy/disc_mpc-keypair.json
          echo ""
          echo "==================================="
