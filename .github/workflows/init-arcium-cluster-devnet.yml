name: Init Arcium Cluster (Devnet)

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest

    env:
      SOLANA_RPC_URL: "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}"
      ARCIUM_CLUSTER_OFFSET: "123"

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq ca-certificates

      - name: Install Solana
        run: |
          curl -sSfL https://release.anza.xyz/v2.3.0/install | bash
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json
          solana config set --keypair ~/.config/solana/id.json
          solana config set --url "${SOLANA_RPC_URL}"

      - name: Install Arcium CLI
        run: |
          curl -fL https://bin.arcium.com/download/arcium_x86_64_linux_0.6.0-alpha -o /tmp/arcium
          chmod +x /tmp/arcium
          sudo mv /tmp/arcium /usr/local/bin/arcium

      - name: Init cluster (ONE TIME)
        working-directory: arcium/disc_mpc
        run: |
          arcium deploy \
            --cluster-offset "${ARCIUM_CLUSTER_OFFSET}" \
            --mempool-size Small \
            --recovery-set-size 1 \
            --keypair-path "$HOME/.config/solana/id.json" \
            --program-name disc_mpc \
            --rpc-url "${SOLANA_RPC_URL}"
