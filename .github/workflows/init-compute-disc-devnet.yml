name: Init ComputeDisc (Devnet)

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest

    env:
      ANCHOR_PROVIDER_URL: "https://devnet.helius-rpc.com/?api-key=${{ secrets.HELIUS_API_KEY }}"
      ANCHOR_WALLET: "/home/runner/.config/solana/id.json"

    steps:
      - uses: actions/checkout@v4

      - name: Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Wallet
        run: |
          mkdir -p ~/.config/solana
          printf '%s' '${{ secrets.SOLANA_WALLET_KEYPAIR }}' > ~/.config/solana/id.json
          chmod 600 ~/.config/solana/id.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deps
        working-directory: arcium/disc_mpc
        run: |
          corepack enable
          yarn install

      - name: Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.32.1 || true
          avm use 0.32.1

      - name: Init computation definition
        working-directory: arcium/disc_mpc
        run: |
          anchor run init_compute_disc_comp_def
