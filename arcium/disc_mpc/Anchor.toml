[toolchain]
anchor_version = "1.0.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
disc_mpc = "8ptu9twKe6UbKR7LhhXV8XorL3gUepUhoUTdEr3kyxxk"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[workspace]
members = [
    "programs",
    "encrypted-ixs"
]
