[toolchain]
anchor_version = "0.32.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
disc_mpc = "BbtWjFrcKQmqSZJfFnL7JvrtZvwtFSj6U7Fx5MrSqEgi"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]

[workspace]
members = [
    "programs",
    "encrypted-ixs"
]
