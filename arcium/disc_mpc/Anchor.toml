[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.0"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
disc_mpc = "PPyR7WKqttjq4ZwcVwrerPsHkUnEkcZ6Vq7zQ1CbSvM"

[provider]
cluster = "https://devnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
wallet = "~/.config/solana/id.json"

[scripts]
init_compute_disc_comp_def = "ts-node scripts/init-devnet.ts"
