[toolchain]
anchor_version = "0.32.1"
solana_version = "2.3.0"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

# -----------------------------
# Programs
# -----------------------------
[programs.localnet]
disc_mpc = "PPyR7WKqttjq4ZwcVwrerPsHkUnEkcZ6Vq7zQ1CbSvM"

[programs.devnet]
disc_mpc = "PPyR7WKqttjq4ZwcVwrerPsHkUnEkcZ6Vq7zQ1CbSvM"

# -----------------------------
# Provider
# -----------------------------
[provider]

cluster = "https://devnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}"
wallet = "~/.config/solana/id.json"

# -----------------------------
# Registry (Anchor)
# -----------------------------
[registry]
url = "https://api.apr.dev"

# -----------------------------
# Scripts 
# -----------------------------
[scripts]
init_compute_disc_comp_def = "anchor run init_compute_disc_comp_def"
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
