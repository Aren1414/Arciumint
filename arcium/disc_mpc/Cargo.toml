[workspace]
members = ["programs/*"]
resolver = "2"

[patch.crates-io]
const-oid = { git = "https://github.com/RustCrypto/formats", tag = "v0.9.6", package = "const-oid" }
borsh = { git = "https://github.com/near/borsh-rs", tag = "borsh-v1.5.0" }
borsh-derive = { git = "https://github.com/near/borsh-rs", tag = "borsh-derive-v1.5.0" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
