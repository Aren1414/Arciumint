[workspace]
members = [
  "programs/*",
  "encrypted-ixs"
]
resolver = "2"

# -------------------------------------------------
# RustCrypto patches (REAL existing tags)
# Rust <= 1.83 compatible
# -------------------------------------------------
[patch.crates-io]
base64ct = { git = "https://github.com/RustCrypto/formats.git", tag = "v1.6.0" }
const-oid = { git = "https://github.com/RustCrypto/formats.git", tag = "v0.9.6" }
pkcs8     = { git = "https://github.com/RustCrypto/formats.git", tag = "v0.10.2" }
sec1      = { git = "https://github.com/RustCrypto/formats.git", tag = "v0.7.3" }
spki      = { git = "https://github.com/RustCrypto/formats.git", tag = "v0.7.3" }

digest = { git = "https://github.com/RustCrypto/traits.git", tag = "v0.10.7" }
crypto-common = { git = "https://github.com/RustCrypto/traits.git", tag = "v0.1.7" }

elliptic-curve = { git = "https://github.com/RustCrypto/elliptic-curves.git", tag = "v0.13.8" }

# -------------------------------------------------
# Release profile (unchanged)
# -------------------------------------------------
[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
