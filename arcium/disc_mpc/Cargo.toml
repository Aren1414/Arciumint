[workspace]
members = [
    "programs",
    "encrypted-ixs"
]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1


[patch.crates-io]

anchor-lang = { git = "https://github.com/coral-xyz/anchor", tag = "v0.32.1" }


borsh = "=1.6.1"
borsh-derive = "=1.6.1"


solana-program = { git = "https://github.com/solana-labs/solana", tag = "v1.18.17" }
