[package]
name = "disc_mpc"
version = "0.1.0"
description = "Created with Arcium & Anchor"
edition = "2021"

[lib]
name = "disc_mpc"
crate-type = ["cdylib", "lib"]

[features]
default = []

cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

idl-build = [
    "anchor-lang/idl-build",
    "arcium-anchor/idl-build"
]

anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang   = { version = "0.32.1", features = ["init-if-needed"] }
arcium-client = { version = "0.10.1", default-features = false }
arcium-anchor = { version = "0.10.1", default-features = false }
arcium-macros = "0.10.1"

[patch.crates-io]
anchor-lang = { version = "0.32.1" }
anchor-spl = { version = "0.32.1" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
