[package]
name = "disc_mpc"
version = "0.1.0"
description = "Created with Arcium & Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "disc_mpc"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "arcium-anchor/idl-build"
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]

# IMPORTANT:
# Must match Anchor CLI 1.0.1 from Arcium installer
anchor-lang = { version = "1.0.1", features = ["init-if-needed"] }

# Arcium stack
arcium-client = { version = "=0.10.1", default-features = false }
arcium-macros = "=0.10.1"
arcium-anchor = "=0.10.1"

# dependency pins
unicode-segmentation = "=1.12.0"
hashbrown = "=0.16.1"
indexmap = "=2.13.1"

# sbpf compatibility
getrandom = { version = "0.2.17", default-features = false, features = ["custom"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
