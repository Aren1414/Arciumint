[package]
name = "disc_mpc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "disc_mpc"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "arcium-anchor/idl-build"
]
anchor-debug = []

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
arcium-client = { version = "=0.10.2", default-features = false }
arcium-macros = "=0.10.2"
arcium-anchor = "=0.10.2"
unicode-segmentation = "=1.12.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
