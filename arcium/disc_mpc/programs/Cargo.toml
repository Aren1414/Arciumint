[package]
name = "disc_mpc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "disc_mpc"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "arcium-anchor/idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
arcium-client = { version = "0.10.3", default-features = false }
arcium-macros = { version = "0.10.3" }
arcium-anchor = { version = "0.10.3" }
unicode-segmentation = "=1.13.2"
getrandom = { version = "0.2.17", features = ["dummy"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
