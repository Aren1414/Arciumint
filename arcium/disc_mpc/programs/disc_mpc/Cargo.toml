[package]
name = "disc_mpc"
version = "0.1.0"
description = "Created with Arcium & Anchor"
edition = "2021"

[lib]
name = "disc_mpc"
crate-type = ["cdylib", "lib"]

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []


idl-build = ["anchor-lang/idl-build"]

anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }

# MUST be default-features = false
arcium-client = { version = "0.6.0-alpha", default-features = false }


arcium-anchor = "0.6.0-alpha"

arcium-macros = "0.6.0-alpha"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
